<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rubik's Cube Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="app">

  <header class="app__header">
    <span class="wordmark">cube/solver</span>
    <span class="api-status" id="apiStatus">checking backend&hellip;</span>
  </header>

  <main class="app__main">

    <section class="viewport">
      <canvas id="cubeCanvas"></canvas>
      <div class="viewport__hint" id="viewportHint">drag to rotate</div>
    </section>

    <aside class="rail">

      <div class="rail__block">
        <h1>Solve a Rubik's cube</h1>
        <p class="lede">Scramble the cube on screen, or scan a real one with your camera. Either way, the solver below finds the moves.</p>
      </div>

      <div class="rail__block controls">
        <button class="btn btn--primary" id="btnScramble">Scramble</button>
        <button class="btn" id="btnSolve">Solve</button>
        <button class="btn" id="btnReset">Reset</button>
        <button class="btn btn--ghost" id="btnScanToggle">Scan real cube</button>
      </div>

      <div class="rail__block scan-panel" id="scanPanel" hidden>
        <div class="scan-panel__video-wrap">
          <video id="scanVideo" autoplay playsinline muted></video>
          <canvas id="scanOverlay"></canvas>
        </div>
        <p class="scan-status" id="scanStatus">Calibrate colors first, then capture each of the 6 faces. Click any captured face below to recapture it.</p>
        <div class="scan-panel__row">
          <button class="btn btn--small" id="btnCalibrate">Calibrate colors</button>
          <button class="btn btn--small" id="btnCapture" disabled>Capture face</button>
        </div>
        <div class="face-tracker" id="faceTracker"></div>
      </div>

      <div class="rail__block log-block">
        <div class="log-block__head">
          <span>Moves</span>
          <span id="moveCount" class="move-count"></span>
        </div>
        <div class="move-log" id="moveLog"></div>
        <div class="playback" id="playback" hidden>
          <button class="btn btn--small" id="btnPlayback">Play solution</button>
          <label class="speed-label">
            speed
            <input type="range" id="speedSlider" min="80" max="600" value="260" />
          </label>
        </div>
      </div>

      <p class="status-line" id="statusLine"></p>

    </aside>

  </main>
</div>

<script type="module" src="cube3d.js"></script>
<script type="module" src="scan.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
